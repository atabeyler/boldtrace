[workspace]
resolver = "2"
members = [
    "shared",
    "exchange-client",
    "score-engine",
    "backtest",
    "bot",
    "product-api",
]

[workspace.package]
version = "0.1.0-alpha"
edition = "2021"
license-file = "LICENSE"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
